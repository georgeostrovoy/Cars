<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cars - Browser Prototype</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="hud">
    <h1>Side-Scrolling Cars (Browser Prototype)</h1>
    <p>A/D - drive | Space - jump | R - reset</p>
    <p id="surface">Surface: dirt</p>
  </div>

  <canvas id="game" width="1280" height="720"></canvas>

  <div id="touch-controls" aria-label="Touch controls">
    <button id="btn-left" class="pedal">◀</button>
    <button id="btn-jump" class="pedal">⤒</button>
    <button id="btn-right" class="pedal">▶</button>
    <button id="btn-reset" class="pedal pedal-small">R</button>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
